{{- if and (.Values.wiz) (.Values.wiz.enable) -}}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: wiz-agent-{{ .Values.env }}
  namespace: {{ .Values.namespace }}
spec:
  goTemplate: true
  generators:
  - list:
      elements:
      {{- range .Values.clusters }}
      - clusterName: {{ .name }}
        provider: {{ .provider }}
      {{- end }} 
  template:
    metadata:
      name: 'wiz-agent-{{`{{.clusterName}}`}}'
    spec:  
      project: default  # Replace with your Argo CD project name  
      source:
        repoURL: {{ .Values.wiz.repoUrl }}  # The Git repository URL
        chart: wiz-kubernetes-integration
        targetRevision: {{ .Values.wiz.targetRevision }}  # Replace with the desired chart version
        helm:
          values: |
            provider: '{{`{{.provider}}`}}'
            {{- toYaml .Values.wiz | nindent 12 }}
      destination:
        namespace: {{ .Values.wiz.namespace }}  # Replace with your desired namespace
        name: '{{`{{.clusterName}}`}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        retry:
          limit: 1
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 1m
{{- end -}}