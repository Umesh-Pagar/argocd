{{- if and (.Values.ingressNginx) (.Values.ingressNginx.enable) -}}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ingress-nginx-{{ .Values.env }}
  namespace: {{ .Values.namespace }}
  labels:
    addon: ingress-nginx
    environment: {{ .Values.env }}
spec:
  goTemplate: true
  generators:
  - list:
      elements:
      {{- range .Values.clusters }}
      - clusterName: {{ .name }}
        provider: {{ .provider }}
      {{- end }} 
  template:
    metadata:
      name: 'ingress-nginx-{{`{{.clusterName}}`}}'
      labels:
        addon: ingress-nginx
        environment: {{ .Values.env }}
        cluster: '{{`{{.clusterName}}`}}'
    spec:
      project: default
      source:
        repoURL: {{ .Values.ingressNginx.repoUrl }}
        chart: ingress-nginx
        targetRevision: {{ .Values.ingressNginx.targetRevision }}
        helm:
          values: |
            provider: '{{`{{.provider}}`}}'
            ingress-nginx:
            {{- toYaml .Values.ingressNginx | nindent 14 }}
              {{`{{- if eq .provider "aws" }}`}}
              controller:
                service:
                  externalTrafficPolicy: "Local"
                  annotations:
                    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
                    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: true
                    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
                    service.beta.kubernetes.io/aws-load-balancer-type: nlb
                    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
                    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: https
                    service.beta.kubernetes.io/aws-load-balancer-extra-security-groups: sg-0abcd1234efgh5678
                allowSnippetAnnotations: true
                config: |
                  allow-snippet-annotations: "true"
                  compute-full-forwarded-for: "true"
                  enable-real-ip: "true"
                  error-log-level: "info"
                  ignore-invalid-headers: "true"
              {{`{{- end }}`}}        
      destination:
        name: '{{`{{.clusterName}}`}}'
        namespace: {{ .Values.ingressNginx.namespace }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        retry:
          limit: 1
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 1m
{{- end -}}